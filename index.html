<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description"
        content="Ремонтні послуги: демонтаж, електрика, сантехніка, плитка, ламінат, фарбування, стяжка, міжкімнатні двері. Швидко, якісно, з гарантією." />
    <meta name="keywords"
        content="ремонт, електрика, сантехніка, плитка, ламінат, стяжка, фарбування, ремонт квартир, косметичний ремонт" />
    <title>Рембуд — ремонтні послуги під ключ</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/hero.css">
    <link rel="stylesheet" href="./styles/about.css">
    <!-- <link rel="stylesheet" href="./styles/about.css"> -->
    <!-- Structured data (LocalBusiness) -->
    <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HomeAndConstructionBusiness",
    "name": "Рембуд",
    "description": "Ремонтні послуги: демонтаж, електрика, сантехніка, плитка, ламінат, фарбування, стяжка, міжкімнатні двері.",
    "telephone": "+380-XX-XXX-XXXX",
    "areaServed": "Ukraine",
    "url": "",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Київ"
    }
  }
  </script>
</head>

<body class="flex flex-col flex-center full-width" style="justify-content: flex-start;">
    <div class="content flex flex-col">
        <div id="header"></div>
        <div id="hero"></div>
        <main id="home" class="container">
            <div id="about"></div>
            <div id="services"></div>
            <div id="portfolio"></div>
            <div id="reviews"></div>
            <div id="contacts"></div>
        </main>
        <div id="footer"></div>
        <div id="modals"></div>
    </div>
    <div id="overlay full-width"></div>
    <script>
        async function loadComponentHTML(id, file) {
            const html = await (await fetch(file)).text();
            const oldEl = document.getElementById(id);
            const temp = document.createElement('div');
            temp.innerHTML = html.trim();
            const newEl = temp.firstElementChild;
            oldEl.replaceWith(newEl);
        }
        async function loadComponentJS(file) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = file;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }
        async function loadComponentsSequentially() {
            const components = ['header', 'hero', 'about',];
            // const components = [ 'about', 'services', 'portfolio', 'reviews', 'contacts', 'footer',];
            for (const c of components) {
                await loadComponentHTML(c, `./components/${c}.html`);
                await loadComponentJS(`./src/${c}.js`);
            }
        }
        loadComponentsSequentially();
    </script>
    <script src="./src/script.js"></script>
</body>

</html>
